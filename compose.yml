x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-7}"

services:
  backend:
    build:
      context: .
      target: backend-runtime
    expose:
      - "8080"
    logging: *default-logging
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend-runtime
    ports:
      - "80:80"
    depends_on:
      - backend
    logging: *default-logging
    restart: unless-stopped

  postgres:
    image: postgres:17
    profiles:
      - database
    environment:
      POSTGRES_DB: wreckage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wreckage"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres-data:
