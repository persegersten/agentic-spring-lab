x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-7}"

services:
  backend:
    build:
      context: .
      target: backend-runtime
    expose:
      - "8080"
    logging: *default-logging
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend-runtime
    ports:
      - "80:8080"
    depends_on:
      - backend
    logging: *default-logging
    restart: unless-stopped
